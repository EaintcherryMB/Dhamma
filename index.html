<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>အိမ့်ချယ်ရီ-လပတ Portal 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-color: #f0f2f5; --card-bg: #ffffff; --text-color: #1c1e21; --sidebar-bg: #2c3e50; --accent: #3498db; }
        [data-theme="dark"] { --bg-color: #18191a; --card-bg: #242526; --text-color: #e4e6eb; --sidebar-bg: #1c1c1c; }
        body { font-family: sans-serif; margin: 0; background-color: var(--bg-color); color: var(--text-color); transition: 0.3s; display: flex; flex-direction: column; }
        @media (min-width: 768px) { body { flex-direction: row; } }
        
        .sidebar { width: 100%; background: var(--sidebar-bg); color: white; padding: 20px; box-sizing: border-box; z-index: 100; }
        @media (min-width: 768px) { .sidebar { width: 280px; height: 100vh; position: fixed; overflow-y: auto; } }
        
        .main { flex: 1; padding: 20px; padding-bottom: 180px; }
        @media (min-width: 768px) { .main { margin-left: 280px; } }
        
        .menu-item { padding: 12px; margin: 8px 0; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid rgba(255,255,255,0.05); }
        .menu-item:hover { background: rgba(255,255,255,0.1); }
        .menu-active { background: var(--accent) !important; font-weight: bold; border: none; }
        
        .post-card { background: var(--card-bg); border-radius: 15px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; border: 1px solid rgba(0,0,0,0.1); transition: 0.3s; }
        
        .music-player { position: fixed; bottom: 0; left: 0; right: 0; background: var(--sidebar-bg); color: white; padding: 15px; display: none; z-index: 2000; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); border-top: 3px solid var(--accent); }
        @media (min-width: 768px) { .music-player { left: 280px; } }
        
        .player-inner { max-width: 800px; margin: auto; display: flex; flex-direction: column; gap: 15px; }
        .player-info { display: flex; align-items: center; justify-content: space-between; }
        .controls { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .controls i { cursor: pointer; transition: 0.2s; font-size: 24px; }
        
        .repeat-box { display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; }
        .active-mode { background: #2ecc71 !important; color: white !important; }
        
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--card-bg); padding: 25px; border-radius: 15px; z-index: 3000; width: 90%; max-width: 450px; color: var(--text-color); }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2999; backdrop-filter: blur(4px); }
        
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; background: var(--card-bg); color: var(--text-color); }
        .btn-play-song { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 30px; cursor: pointer; margin-top: 10px; display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .btn-primary { background: #2ecc71; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-outline { background: none; border: 1px solid #2ecc71; color: #2ecc71; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .user-box { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid var(--accent); }
    </style>
</head>
<body data-theme="light">

    <div class="sidebar">
        <h2>🎓 အိမ့်ချယ်ရီ 2026</h2>
        <div id="theme-btn" style="cursor:pointer; text-align:center; padding:8px; background:rgba(255,255,255,0.05); border-radius:5px; margin-bottom:15px;">🌓 Theme Change</div>
        
        <div class="user-box">
            <span id="display-name">ဧည့်သည် (Guest)</span><br>
            <small id="user-role">အများသုံးစနစ်</small>
        </div>

        <div id="m-all" class="menu-item menu-active" onclick="loadContent('all')">🏠 အားလုံး</div>
        <div id="m-audio" class="menu-item" onclick="loadContent('audio')">🎵 သီချင်းများ</div>
        <div id="m-dhamma" class="menu-item" onclick="loadContent('dhamma')">📘 တရားများ</div>
        <div id="m-knowledge" class="menu-item" onclick="loadContent('knowledge')">📚 စာပေဗဟုသုတ</div>

        <div style="margin-top:20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top:15px;">
            <div id="guest-tools">
                <button class="btn-outline" onclick="showModal('signup-modal')">📝 အကောင့်ဖွင့်ရန်</button>
                <div onclick="showModal('login-modal')" style="cursor:pointer; text-align:center; font-size: 13px; color: #bbb; margin-top:10px;">Login ဝင်ရန်</div>
            </div>
            <button id="logout-btn" onclick="location.reload()" style="display:none; width:100%; background:#e74c3c; color:white; border:none; padding:10px; border-radius:8px;">Logout</button>
        </div>
    </div>

    <div class="main">
        <h1 id="category-title" style="text-align:center;">🏠 အားလုံး</h1>
        <div id="content-display">အချက်အလက်များ ရှာဖွေနေပါသည်...</div>
    </div>

    <div class="music-player" id="global-player">
        <div class="player-inner">
            <div class="player-info">
                <div style="overflow: hidden; white-space: nowrap;">
                    <b id="now-playing-title" style="font-size: 16px;">သီချင်းရွေးချယ်ပါ</b><br>
                    <small id="now-playing-cat" style="color: #bbb;"></small>
                </div>
                <i class="fa-solid fa-circle-xmark" onclick="closePlayer()" style="cursor:pointer; font-size: 20px; color: #e74c3c;"></i>
            </div>
            <audio id="main-audio-element"></audio>
            <div class="controls">
                <div class="repeat-box" id="repeat-container" onclick="toggleRepeat()">
                    <i class="fa-solid fa-repeat" id="repeat-icon"></i>
                    <span id="repeat-text">Off</span>
                </div>
                <div style="display:flex; align-items:center; gap:25px;">
                    <i class="fa-solid fa-backward-step" onclick="playPrev()"></i>
                    <i class="fa-solid fa-circle-play" id="btn-play-pause" onclick="togglePlay()" style="font-size: 40px; color: #2ecc71;"></i>
                    <i class="fa-solid fa-forward-step" onclick="playNext()"></i>
                </div>
            </div>
        </div>
    </div>

    <div id="overlay"></div>

    <div id="login-modal" class="modal">
        <h3>Login ဝင်ရန်</h3>
        <input type="text" id="loginUser" placeholder="Username">
        <input type="password" id="loginPass" placeholder="Password">
        <button class="btn-primary" id="login-submit">ဝင်မည်</button>
    </div>

    <div id="signup-modal" class="modal">
        <h3>Sign Up</h3>
        <input type="text" id="regName" placeholder="နာမည်အပြည့်အစုံ">
        <input type="text" id="regUser" placeholder="Username">
        <input type="password" id="regPass" placeholder="Password">
        <button class="btn-primary" id="signup-submit">အကောင့်ဖွင့်မည်</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, where, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4c2aE6LOMjf00e_SPIB7snz8MbYy37_g",
            authDomain: "mymusicapp-380.firebaseapp.com",
            projectId: "mymusicapp-380",
            storageBucket: "mymusicapp-380.firebasestorage.app",
            messagingSenderId: "362148026754",
            appId: "1:362148026754:web:e5b21177553bcf4444979b"
        };

        const GH_ACCOUNTS = [
            { user: "EaintcherryMB", repo: "music-gitapp", folder: "" },
             { user: "EaintcherryMB", repo: "Songs", folder: "" },
              { user: "EaintcherryMB", repo: "Dhamma", folder: "" },
            { user: "cherry08-p", repo: "MymusicApp", folder: "" }
        ];

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let playlist = [];
        let currentIndex = -1;
        let repeatMode = 'off'; 

        const audioPlayer = document.getElementById('main-audio-element');
        const playBtn = document.getElementById('btn-play-pause');

        // GitHub မှ သီချင်းများ ဆွဲယူခြင်း
        async function fetchGitHubSongs() {
            for (const acc of GH_ACCOUNTS) {
                try {
                    const res = await fetch(`https://api.github.com/repos/${acc.user}/${acc.repo}/contents/${acc.folder}`);
                    const files = await res.json();
                    if(!Array.isArray(files)) continue;

                    const musicFiles = files.filter(f => f.name.toLowerCase().endsWith('.mp3') || f.name.toLowerCase().endsWith('.m4a'));

                    musicFiles.forEach(file => {
                        const song = {
                            title: file.name.replace(/\.[^/.]+$/, ""),
                            category: "audio",
                            link: file.download_url
                        };
                        playlist.push(song);
                        renderCard(song, playlist.length - 1, true);
                    });
                } catch (e) { console.error("GH Error:", e); }
            }
        }

        function renderCard(data, index, isGitHub = false) {
            const display = document.getElementById('content-display');
            const card = document.createElement('div');
            card.className = "post-card";
            card.innerHTML = `
                <div style="padding:20px;">
                    <small style="color:var(--accent); font-weight:bold; background:rgba(52,152,219,0.1); padding:4px 10px; border-radius:15px;">#${isGitHub ? 'G' : data.category}</small>
                    <h2 style="margin:15px 0 10px 0;">${data.title}</h2>
                    <button class="btn-play-song" onclick="playSong(${index})">
                        <i class="fa-solid fa-play"></i> ဖွင့်မည်
                    </button>
                </div>`;
            display.appendChild(card);
        }

        // --- GLOBAL FUNCTIONS (WINDOW OBJECT) ---

        window.loadContent = (filter = 'all') => {
            playlist = [];
            const display = document.getElementById('content-display');
            display.innerHTML = "ရှာဖွေနေပါသည်...";
            
            // Menu UI update
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('menu-active'));
            const activeMenu = document.getElementById('m-' + filter);
            if(activeMenu) activeMenu.classList.add('menu-active');

            const titles = { all: "🏠 အားလုံး", audio: "🎵 သီချင်းများ", dhamma: "📘 တရားများ", knowledge: "📚 စာပေဗဟုသုတ" };
            document.getElementById('category-title').innerText = titles[filter] || titles.all;

            let q = query(collection(db, "portal_content"), orderBy("date", "desc"));
            if(filter !== 'all') q = query(collection(db, "portal_content"), where("category", "==", filter));

            onSnapshot(q, (snap) => {
                display.innerHTML = "";
                snap.forEach(d => {
                    const data = { ...d.data(), id: d.id };
                    playlist.push(data);
                    renderCard(data, playlist.length - 1);
                });
                if(filter === 'all' || filter === 'audio') fetchGitHubSongs();
            });
        };

        window.playSong = (index) => {
            currentIndex = index;
            const song = playlist[currentIndex];
            document.getElementById('global-player').style.display = 'block';
            document.getElementById('now-playing-title').innerText = song.title;
            document.getElementById('now-playing-cat').innerText = "#" + song.category;
            audioPlayer.src = song.link;
            audioPlayer.play();
            updatePlayIcon(true);
        };

        window.togglePlay = () => {
            if (audioPlayer.paused) { audioPlayer.play(); updatePlayIcon(true); }
            else { audioPlayer.pause(); updatePlayIcon(false); }
        };

        function updatePlayIcon(isPlaying) {
            playBtn.className = isPlaying ? "fa-solid fa-circle-pause" : "fa-solid fa-circle-play";
        }

        window.playNext = () => {
            if (++currentIndex >= playlist.length) currentIndex = 0;
            playSong(currentIndex);
        };

        window.playPrev = () => {
            if (--currentIndex < 0) currentIndex = playlist.length - 1;
            playSong(currentIndex);
        };

        window.toggleRepeat = () => {
            const btn = document.getElementById('repeat-container');
            const txt = document.getElementById('repeat-text');
            if (repeatMode === 'off') { repeatMode = 'all'; btn.classList.add('active-mode'); txt.innerText = "All"; }
            else if (repeatMode === 'all') { repeatMode = 'one'; txt.innerText = "One"; }
            else { repeatMode = 'off'; btn.classList.remove('active-mode'); txt.innerText = "Off"; }
        };

        audioPlayer.onended = () => {
            if (repeatMode === 'one') { audioPlayer.currentTime = 0; audioPlayer.play(); }
            else playNext();
        };

        window.closePlayer = () => { audioPlayer.pause(); document.getElementById('global-player').style.display = 'none'; };

        window.showModal = (id) => { 
            document.getElementById(id).style.display = 'block'; 
            document.getElementById('overlay').style.display = 'block'; 
        };

        window.hideAllModals = () => { 
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); 
            document.getElementById('overlay').style.display = 'none'; 
        };

        // UI Events
        document.getElementById('overlay').onclick = hideAllModals;
        document.getElementById('theme-btn').onclick = () => {
            const b = document.body;
            b.setAttribute('data-theme', b.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        };

        document.getElementById('login-submit').onclick = async () => {
            const user = document.getElementById('loginUser').value.toLowerCase().trim();
            const pass = document.getElementById('loginPass').value;
            try {
                const s = await getDoc(doc(db, "portal_users", user));
                if(s.exists() && s.data().password === pass) { 
                    const data = s.data();
                    document.getElementById('display-name').innerText = data.fullName;
                    document.getElementById('guest-tools').style.display = "none";
                    document.getElementById('logout-btn').style.display = "block";
                    hideAllModals(); 
                } else { alert("Username သို့မဟုတ် Password မှားနေပါသည်"); }
            } catch(e) { alert("Login Error"); }
        };

        // Initial Load
        loadContent('all');

    </script>
</body>
  </html>
